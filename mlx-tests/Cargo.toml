[package]
name = "mlx-tests"
edition = "2021"
version.workspace = true
authors.workspace = true

[dependencies]

[features]
# Forwards to mlx-lm's `image` feature so the VLM e2e test compiles. The
# `image` decode crate is an unconditional dev-dependency (cheap, test-only).
image = ["mlx-lm/image"]
# Forwards to mlx-lm's `audio` feature for the audio e2e test. `hound` (WAV
# decode) is an unconditional dev-dependency (cheap, test-only).
audio = ["mlx-lm/audio"]

[dev-dependencies]
mlx-internal-macros.workspace = true
mlx-rs.workspace = true
mlx-lm.workspace = true
tempfile.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
hound = "3"
