[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.88.0"

[workspace]
resolver = "2"

[dependencies]
bindgen = "=0.72.1"
quote = "1"
public-api = "=0.50.0"
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
tempfile = "3"
