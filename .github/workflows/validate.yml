name: validate
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: blaze/macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          # verify-oracle-boundary --base walks the commit range; a shallow
          # clone has no history to walk.
          fetch-depth: 0
      - run: sudo xcodes select 16.4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - run: cargo --version
      - run: cargo fmt -- --check
      - run: cargo clippy -- -D warnings
      # Oracle trust boundary: implementation changes may not alter goldens,
      # policies, or comparator logic in the same change set (ROADMAP.md,
      # "Anti-self-oracle rules"). Working-tree integrity always; range check
      # on PRs.
      - run: cargo run -p xtask -- verify-oracle-boundary
        if: github.event_name != 'pull_request'
      - run: cargo run -p xtask -- verify-oracle-boundary --base ${{ github.event.pull_request.base.sha }}
        if: github.event_name == 'pull_request'

  # Proves the leak gate works on THIS runner before trusting it: leaks can
  # attach, a deliberate leak is detected, the clean 21-binary gate passes in
  # budget. A runner that denies task ports fails loudly here instead of
  # producing a silently green gate.
  ffi-gate:
    runs-on: blaze/macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: sudo xcodes select 16.4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
        with:
          key: ffi-gate-${{ hashFiles('**/Cargo.toml') }}
      - run: cargo run -p xtask -- verify-ffi --calibrate --budget-seconds 1200 | tee verify-ffi-calibration.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-ffi-calibration
          path: verify-ffi-calibration.json

  tests:
    runs-on: blaze/${{ matrix.runner }}
    strategy:
      matrix:
        runner: [macos-15]
        rust: [1.88.0, stable]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: sudo xcodes select 16.4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          toolchain: ${{ matrix.rust }}
          rustflags: "" # Disable when we're ready
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}-${{ matrix.runner }}-${{ hashFiles('**/Cargo.toml') }}
      - run: cargo test --all -- --test-threads=1 # MLX is not thread safe
