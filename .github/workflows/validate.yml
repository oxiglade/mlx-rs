name: validate
on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!**/*.md'
      # The oracle-boundary check covers everything under conformance/, docs included.
      - 'conformance/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**'
      - '!**/*.md'
      - 'conformance/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    uses: ./.github/workflows/bump-admission.yml
    with:
      ordinary: true
