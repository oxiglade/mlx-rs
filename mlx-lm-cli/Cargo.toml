[package]
name = "mlx-lm-cli"
version = "0.32.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Public-API command-line consumer for mlx-lm"
publish = false

[[bin]]
name = "mlx-lm"
path = "src/main.rs"

[features]
default = []
hf-hub = ["mlx-lm/hf-hub"]

[dependencies]
mlx-lm = { path = "../mlx-lm", version = "0.32", default-features = false }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
